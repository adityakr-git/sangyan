<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="16 12" opacity="0.3"/>

  <!-- Shield Core -->
  <path d="M256 80 L390 140 C390 270 330 375 256 424 C182 375 122 270 122 140 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)"/>

  <!-- Inner Dark Contrast Pad -->
  <path d="M256 108 L366 156 C366 260 318 348 256 388 C194 348 146 260 146 156 Z" 
        fill="#0f172a" opacity="0.92"/>

  <!-- Raised Palm / Pause Icon (Ruko symbol) -->
  <g fill="#f59e0b" transform="translate(196, 170)">
    <!-- Palm base -->
    <path d="M15 85 C15 125 45 155 85 155 C125 155 155 125 155 85 L155 60 L15 60 Z" />
    <!-- 4 Fingers -->
    <rect x="20" y="5" width="22" height="75" rx="11" />
    <rect x="48" y="-12" width="22" height="92" rx="11" />
    <rect x="76" y="-8" width="22" height="88" rx="11" />
    <rect x="104" y="10" width="22" height="70" rx="11" />
    <!-- Thumb -->
    <path d="M-6 56 C-6 45 6 36 18 42 L25 46 L25 80 L10 80 C0 80 -6 70 -6 56 Z" />
  </g>

  <!-- Bilingual Text Emblem "संज्ञान / SANGYAN" -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="30" fill="#f8fafc" letter-spacing="3">
    संज्ञान • SANGYAN
  </text>
</svg>
